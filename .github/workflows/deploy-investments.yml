# Manual only. Do not add push, pull_request, or schedule triggers.
# Source is AlexandreBellas/investbrain, not upstream investbrainapp/investbrain releases.
# Default ref is that fork's main HEAD, resolved to a commit SHA before download.

name: Deploy Investments

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA on AlexandreBellas/investbrain. Empty deploys main HEAD."
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Resolve fork commit and download source
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env so the value is never interpolated into the script.
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          repo="AlexandreBellas/investbrain"
          ref="${REQUESTED_REF:-}"
          if [[ -z "${ref}" ]]; then
            ref="main"
          fi
          if [[ "${#ref}" -gt 255 || ! "${ref}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Ref may only contain letters, numbers, and the characters . _ / - (max 255)." >&2
            exit 1
          fi
          IFS='/' read -ra ref_parts <<< "${ref}"
          if [[ "${#ref_parts[@]}" -eq 0 ]]; then
            echo "Ref is not a valid git ref." >&2
            exit 1
          fi
          for part in "${ref_parts[@]}"; do
            if [[ -z "${part}" || "${part}" == "." || "${part}" == ".." ]]; then
              echo "Ref is not a valid git ref." >&2
              exit 1
            fi
          done

          echo "Resolving ${repo} ref ${ref}"
          encoded="$(jq -rn --arg r "${ref}" '$r|@uri')"
          sha="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/commits/${encoded}" \
            | jq -er '.sha')"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return a full commit SHA." >&2
            exit 1
          fi
          # A hex-only ref is a SHA. Require GitHub to return that commit.
          if [[ "${ref}" =~ ^[0-9a-fA-F]+$ ]]; then
            wanted="$(printf '%s' "${ref}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${#wanted}" -lt 7 || "${sha}" != "${wanted}"* ]]; then
              echo "Resolved commit does not match the requested SHA." >&2
              exit 1
            fi
          fi

          mkdir -p build
          curl -fL --retry 3 --retry-delay 2 -o build/source.zip \
            "https://github.com/${repo}/archive/${sha}.zip"
          {
            echo "sha=${sha}"
            echo "archive=Investments-${sha}.zip"
          } >> "${GITHUB_OUTPUT}"
          echo "Source commit: ${sha}"
          echo "Archive: Investments-${sha}.zip"
          {
            echo "### Investbrain source"
            echo ""
            echo "- Repository: \`${repo}\`"
            echo "- Requested ref: \`${ref}\`"
            echo "- Commit: \`${sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The fork's composer.json requires PHP ^8.4.
      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, sodium, tokenizer, xml, zip
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies and build assets
        env:
          COMPOSER_MEMORY_LIMIT: "-1"
          COMPOSER_NO_INTERACTION: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          rm -rf build/extract build/app
          unzip -q build/source.zip -d build/extract
          mapfile -t src_dirs < <(find build/extract -mindepth 1 -maxdepth 1 -type d | sort)
          if [[ "${#src_dirs[@]}" -ne 1 ]]; then
            echo "Expected one top-level directory in the release archive, found ${#src_dirs[@]}." >&2
            exit 1
          fi
          mv "${src_dirs[0]}" build/app
          cd build/app
          composer install --no-dev --no-scripts --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
          rm -rf node_modules tests docker
          rm -f public/hot

      # Workaround until upstream fixes the GROUP BY in Holding::scopeGetPortfolioMetrics; remove this step then.
      - name: Patch MySQL sql_mode (drop ONLY_FULL_GROUP_BY)
        working-directory: build/app
        run: |
          set -euo pipefail
          sed -i "s/'strict' => true,/'strict' => true,\n            'modes' => ['STRICT_TRANS_TABLES', 'NO_ZERO_IN_DATE', 'NO_ZERO_DATE', 'ERROR_FOR_DIVISION_BY_ZERO', 'NO_ENGINE_SUBSTITUTION'],/" config/database.php
          grep -q "'modes' =>" config/database.php || { echo "strict-mode patch did not apply"; exit 1; }

      # Artisan has to boot during the build. This key is generated here and the file
      # is deleted before the archive is created. Server secrets are written over SSH.
      - name: Prepare a build-only .env
        working-directory: build/app
        run: |
          set -euo pipefail
          umask 077
          app_key="base64:$(openssl rand -base64 32)"
          cat > .env << EOF
          APP_NAME=Investbrain
          APP_ENV=local
          APP_KEY=${app_key}
          APP_DEBUG=false
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          EOF
          chmod 600 .env

      - name: Discover packages
        run: |
          set -euo pipefail
          mkdir -p \
            build/app/storage/framework/cache/data \
            build/app/storage/framework/sessions \
            build/app/storage/framework/views \
            build/app/storage/app/public \
            build/app/storage/logs \
            build/app/bootstrap/cache
          cd build/app
          php artisan package:discover --ansi
          php artisan filament:upgrade

      - name: Add root .htaccess and zip
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          cp .htaccess build/app/.htaccess
          cp deploy/mysql/*.php build/app/database/migrations/
          rm -f build/app/.env build/app/bootstrap/cache/config.php
          rm -rf release
          mkdir -p release
          (
            cd build/app
            zip -qr "../../release/${ARCHIVE:?}" . -x '.env'
          )
          if unzip -Z1 "release/${ARCHIVE}" | grep -Eq '(^|/)\.env$'; then
            echo "Archive contains .env." >&2
            exit 1
          fi

      - name: Upload archive over SSH
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          source: release/Investments-*.zip
          target: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
          strip_components: 1
          overwrite: true
          command_timeout: 15m

      # unzip -o leaves files the new release removed. Laravel then loads every
      # config/*.php, so a leftover config/sanctum.php 500s once Sanctum is gone.
      - name: Swap release, migrate, and cache
        id: swap
        uses: appleboy/ssh-action@v1.2.5
        env:
          INVESTMENTS_SSH_REMOTE_PATH: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
          INVESTMENTS_PHP_BIN: ${{ secrets.INVESTMENTS_PHP_BIN }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          INVESTMENTS_APP_KEY: ${{ secrets.INVESTMENTS_APP_KEY }}
          INVESTMENTS_APP_URL: ${{ secrets.INVESTMENTS_APP_URL }}
          INVESTMENTS_ASSET_URL: ${{ secrets.INVESTMENTS_ASSET_URL }}
          INVESTMENTS_MARKET_DATA_PROVIDER: ${{ secrets.INVESTMENTS_MARKET_DATA_PROVIDER }}
          INVESTMENTS_ALPHAVANTAGE_API_KEY: ${{ secrets.INVESTMENTS_ALPHAVANTAGE_API_KEY }}
          INVESTMENTS_FINNHUB_API_KEY: ${{ secrets.INVESTMENTS_FINNHUB_API_KEY }}
          INVESTMENTS_ALPACA_API_KEY: ${{ secrets.INVESTMENTS_ALPACA_API_KEY }}
          INVESTMENTS_ALPACA_API_SECRET: ${{ secrets.INVESTMENTS_ALPACA_API_SECRET }}
          INVESTMENTS_TWELVEDATA_API_SECRET: ${{ secrets.INVESTMENTS_TWELVEDATA_API_SECRET }}
          INVESTMENTS_MARKET_DATA_REFRESH: ${{ secrets.INVESTMENTS_MARKET_DATA_REFRESH }}
          INVESTMENTS_APP_TIMEZONE: ${{ secrets.INVESTMENTS_APP_TIMEZONE }}
          INVESTMENTS_AI_CHAT_ENABLED: ${{ secrets.INVESTMENTS_AI_CHAT_ENABLED }}
          INVESTMENTS_CHAT_PROVIDER: ${{ secrets.INVESTMENTS_CHAT_PROVIDER }}
          INVESTMENTS_CHAT_MODEL: ${{ secrets.INVESTMENTS_CHAT_MODEL }}
          INVESTMENTS_OPENAI_API_KEY: ${{ secrets.INVESTMENTS_OPENAI_API_KEY }}
          INVESTMENTS_DAILY_CHANGE_TIME: ${{ secrets.INVESTMENTS_DAILY_CHANGE_TIME }}
          INVESTMENTS_REGISTRATION_ENABLED: ${{ secrets.INVESTMENTS_REGISTRATION_ENABLED }}
          INVESTMENTS_BASE_CURRENCY: ${{ secrets.INVESTMENTS_BASE_CURRENCY }}
          INVESTMENTS_DB_CONNECTION: ${{ secrets.INVESTMENTS_DB_CONNECTION }}
          INVESTMENTS_DB_HOST: ${{ secrets.INVESTMENTS_DB_HOST }}
          INVESTMENTS_DB_PORT: ${{ secrets.INVESTMENTS_DB_PORT }}
          INVESTMENTS_DB_DATABASE: ${{ secrets.INVESTMENTS_DB_DATABASE }}
          INVESTMENTS_DB_USERNAME: ${{ secrets.INVESTMENTS_DB_USERNAME }}
          INVESTMENTS_DB_PASSWORD: ${{ secrets.INVESTMENTS_DB_PASSWORD }}
          INVESTMENTS_CACHE_STORE: ${{ secrets.INVESTMENTS_CACHE_STORE }}
          INVESTMENTS_QUEUE_CONNECTION: ${{ secrets.INVESTMENTS_QUEUE_CONNECTION }}
          INVESTMENTS_SESSION_DRIVER: ${{ secrets.INVESTMENTS_SESSION_DRIVER }}
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          command_timeout: 30m
          script_stop: true
          envs: INVESTMENTS_SSH_REMOTE_PATH,INVESTMENTS_PHP_BIN,ARCHIVE,INVESTMENTS_APP_KEY,INVESTMENTS_APP_URL,INVESTMENTS_ASSET_URL,INVESTMENTS_MARKET_DATA_PROVIDER,INVESTMENTS_ALPHAVANTAGE_API_KEY,INVESTMENTS_FINNHUB_API_KEY,INVESTMENTS_ALPACA_API_KEY,INVESTMENTS_ALPACA_API_SECRET,INVESTMENTS_TWELVEDATA_API_SECRET,INVESTMENTS_MARKET_DATA_REFRESH,INVESTMENTS_APP_TIMEZONE,INVESTMENTS_AI_CHAT_ENABLED,INVESTMENTS_CHAT_PROVIDER,INVESTMENTS_CHAT_MODEL,INVESTMENTS_OPENAI_API_KEY,INVESTMENTS_DAILY_CHANGE_TIME,INVESTMENTS_REGISTRATION_ENABLED,INVESTMENTS_BASE_CURRENCY,INVESTMENTS_DB_CONNECTION,INVESTMENTS_DB_HOST,INVESTMENTS_DB_PORT,INVESTMENTS_DB_DATABASE,INVESTMENTS_DB_USERNAME,INVESTMENTS_DB_PASSWORD,INVESTMENTS_CACHE_STORE,INVESTMENTS_QUEUE_CONNECTION,INVESTMENTS_SESSION_DRIVER
          script: |
            set -eu

            remote=$INVESTMENTS_SSH_REMOTE_PATH
            php=$INVESTMENTS_PHP_BIN
            archive=$ARCHIVE
            swapped=0
            phase=init
            stage=
            prev=
            status=0
            secrets_env=

            reject() {
              echo "$1" >&2
              exit 1
            }

            case $remote in
              /[A-Za-z0-9._/-]*) ;;
              *) reject "Remote path is not an absolute path with safe characters." ;;
            esac
            case $remote in
              */) reject "Remote path must not have a trailing slash." ;;
              *..*) reject "Remote path must not contain .." ;;
            esac
            case $php in
              /[A-Za-z0-9._+/-]*) ;;
              *) reject "PHP binary is not an absolute path with safe characters." ;;
            esac
            case $php in
              *..*) reject "PHP binary path must not contain .." ;;
            esac
            case $archive in
              Investments-*.zip) ;;
              *) reject "Unexpected archive name." ;;
            esac
            sha=${archive#Investments-}
            sha=${sha%.zip}
            case $sha in
              *[!0-9a-f]*) reject "Unexpected archive name." ;;
            esac
            if [ "${#sha}" -ne 40 ]; then
              reject "Unexpected archive name."
            fi
            if [ -L "$remote" ]; then
              reject "Remote path is a symlink."
            fi

            parent=$(dirname "$remote")
            if [ "$parent" = "/" ] || [ "$parent" = "$remote" ]; then
              reject "Refusing to stage a release next to the filesystem root."
            fi

            # A sibling swap renames the live directory. If that was interrupted
            # after the rename, put it back before choosing a mode.
            if [ ! -e "$remote" ] && [ -f "$parent/.investbrain-previous/.env" ] && [ -d "$parent/.investbrain-previous/storage" ] && [ -f "$parent/.investbrain-previous/artisan" ]; then
              echo "Restoring the previous tree into the missing live path."
              mv -- "$parent/.investbrain-previous" "$remote"
            fi
            if [ ! -d "$remote" ]; then
              reject "Remote path is not a real directory."
            fi

            use_sibling=0
            if [ -w "$parent" ] && [ -x "$parent" ]; then
              if [ "$(stat -c '%d' "$remote")" = "$(stat -c '%d' "$parent")" ]; then
                use_sibling=1
              fi
            fi
            if [ "$use_sibling" = "1" ]; then
              stage=$parent/.investbrain-stage
              prev=$parent/.investbrain-previous
            else
              stage=$remote/.investbrain-stage
              prev=$remote/.investbrain-previous
            fi
            if [ "$stage" = "$remote" ] || [ "$prev" = "$remote" ]; then
              reject "Stage path collided with the live directory."
            fi
            if [ -d "$remote" ] && [ -d "$prev" ] && [ ! -e "$remote/artisan" ] && [ -f "$prev/artisan" ]; then
              echo "Restoring code moved aside by an interrupted release."
              case $prev in
                */.investbrain-previous) ;;
                *) reject "Refusing to restore from an unexpected path." ;;
              esac
              for entry in "$prev"/* "$prev"/.[!.]* "$prev"/..?*; do
                if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
                  continue
                fi
                name=${entry##*/}
                case $name in
                  .|..|.env|storage|.release-names) continue ;;
                esac
                mv -- "$entry" "$remote/"
              done
              if [ ! -e "$prev/.env" ] && [ ! -e "$prev/storage" ]; then
                rm -rf -- "$prev"
              fi
            fi
            if [ ! -d "$remote" ]; then
              reject "Remote path is not a real directory."
            fi
            if [ ! -f "$remote/$archive" ]; then
              reject "Archive was not uploaded into the remote directory."
            fi

            is_preserved_name() {
              case $1 in
                .|..|.env|storage|.user.ini|php.ini|.php-version|cgi-bin|.investbrain-stage|.investbrain-previous|.release-names)
                  return 0
                  ;;
              esac
              return 1
            }

            assert_work_dir() {
              case $1 in
                */.investbrain-stage|*/.investbrain-previous) ;;
                *) reject "Refusing to delete an unexpected path." ;;
              esac
            }

            # optimize:clear deletes compiled views and file-cache entries from the
            # live tree after the hardlink. Those names stay in the previous tree
            # with nlink 1. Logs, sessions, cache, and views are disposable.
            # Any other unique file, including Passport keys and uploads, blocks
            # deletion so the only copy is never removed.
            unique_storage_files() {
              dir=$1
              shift
              find "$dir" -type f -links 1 \
                ! -path '*/storage/logs/*' \
                ! -path '*/storage/framework/cache/*' \
                ! -path '*/storage/framework/sessions/*' \
                ! -path '*/storage/framework/views/*' \
                "$@"
            }

            discard_previous() {
              if [ ! -e "$prev" ]; then
                return 0
              fi
              assert_work_dir "$prev"
              if [ -f "$prev/.env" ]; then
                if [ ! -f "$remote/.env" ]; then
                  reject "Previous tree has .env but the live tree does not."
                fi
                if [ "$(stat -c '%i' "$prev/.env")" != "$(stat -c '%i' "$remote/.env")" ]; then
                  reject "Previous .env is not the live server .env."
                fi
                rm -f -- "$prev/.env"
              fi
              if [ -e "$prev/storage" ]; then
                if [ ! -d "$remote/storage" ]; then
                  reject "Previous tree has storage but the live tree does not."
                fi
                if unique_storage_files "$prev/storage" -print -quit | grep -q .; then
                  echo "Previous storage has a file that is not linked into the live tree:" >&2
                  unique_storage_files "$prev/storage" -printf '%P\n' >&2
                  reject "Previous storage has a file that is not linked into the live tree."
                fi
                rm -rf -- "$prev/storage"
              fi
              if [ -e "$prev/.env" ] || [ -e "$prev/storage" ]; then
                reject "Previous tree still holds .env or storage."
              fi
              rm -rf -- "$prev"
            }

            # A failed release can leave .investbrain-failed beside the docroot.
            # Remove it only when its .env is the live one and every unique storage
            # file is a log, cache, session, view, or passport key created here.
            retire_failed_tree() {
              dir=$1
              if [ ! -e "$dir" ]; then
                return 0
              fi
              case $dir in
                */.investbrain-failed|*/.investbrain-failed-*) ;;
                *) echo "Refusing to delete an unexpected path." >&2; return 1 ;;
              esac
              if [ -f "$dir/.env" ]; then
                if [ ! -f "$remote/.env" ] || [ "$(stat -c '%i' "$dir/.env")" != "$(stat -c '%i' "$remote/.env")" ]; then
                  echo "Leaving ${dir##*/} because its .env is not the live .env." >&2
                  return 0
                fi
                rm -f -- "$dir/.env"
              fi
              if [ -e "$dir/storage" ]; then
                if [ ! -d "$remote/storage" ]; then
                  echo "Leaving ${dir##*/} because the live storage directory is missing." >&2
                  return 0
                fi
                if find "$dir/storage" -type f -links 1 \
                    ! -path '*/storage/logs/*' \
                    ! -path '*/storage/framework/cache/*' \
                    ! -path '*/storage/framework/sessions/*' \
                    ! -path '*/storage/framework/views/*' \
                    ! -name 'oauth-private.key' \
                    ! -name 'oauth-public.key' \
                    -print -quit | grep -q .; then
                  echo "Leaving ${dir##*/} because storage has a unique file that is not a log, cache, session, or passport key." >&2
                  return 0
                fi
                rm -rf -- "$dir/storage"
              fi
              if [ -e "$dir/.env" ] || [ -e "$dir/storage" ]; then
                echo "Leaving ${dir##*/} in place." >&2
                return 0
              fi
              rm -rf -- "$dir"
              echo "Removed ${dir##*/}."
            }

            move_dest=
            move_unpreserved() {
              for entry in "$1"/* "$1"/.[!.]* "$1"/..?*; do
                if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
                  continue
                fi
                name=${entry##*/}
                if is_preserved_name "$name"; then
                  continue
                fi
                mv -- "$entry" "$move_dest/"
              done
            }

            restore_inplace() {
              if [ "$phase" = "moving-new" ] && [ -f "$prev/.release-names" ]; then
                while IFS= read -r name; do
                  case $name in
                    ''|.|..|*/*|*..*) continue ;;
                  esac
                  if is_preserved_name "$name"; then
                    continue
                  fi
                  if [ -e "$remote/$name" ] || [ -L "$remote/$name" ]; then
                    rm -rf -- "$remote/$name"
                  fi
                done < "$prev/.release-names"
              fi
              if [ -d "$prev" ]; then
                for entry in "$prev"/* "$prev"/.[!.]* "$prev"/..?*; do
                  if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
                    continue
                  fi
                  name=${entry##*/}
                  case $name in
                    .release-names) continue ;;
                  esac
                  mv -- "$entry" "$remote/"
                done
              fi
            }

            cleanup() {
              status=$?
              trap - EXIT
              if [ -n "$secrets_env" ] && [ -f "$secrets_env" ]; then
                rm -f -- "$secrets_env"
              fi
              if [ "$status" -ne 0 ] && [ "$swapped" != "1" ]; then
                if [ "$phase" = "moving-old" ] || [ "$phase" = "moving-new" ]; then
                  restore_inplace || echo "CRITICAL: could not restore the previous tree." >&2
                fi
                if [ "$phase" = "swapping" ] && [ ! -d "$remote" ] && [ -d "$prev" ]; then
                  mv -- "$prev" "$remote" || echo "CRITICAL: live directory was not restored." >&2
                fi
                if [ -n "$stage" ] && [ -d "$stage" ]; then
                  if [ -f "$remote/.env" ] && [ -d "$remote/storage" ]; then
                    assert_work_dir "$stage"
                    rm -rf -- "$stage"
                  else
                    echo "Leaving the stage directory in place because live .env or storage is missing." >&2
                  fi
                fi
              fi
              if [ "$status" -ne 0 ]; then
                exit "$status"
              fi
            }
            trap cleanup EXIT

            if [ -e "$stage" ]; then
              if [ ! -f "$remote/.env" ] || [ ! -d "$remote/storage" ]; then
                reject "Leftover stage exists and live .env or storage is missing."
              fi
              assert_work_dir "$stage"
              rm -rf -- "$stage"
            fi
            discard_previous
            for failed_dir in "$parent"/.investbrain-failed "$parent"/.investbrain-failed-*; do
              if [ -e "$failed_dir" ]; then
                retire_failed_tree "$failed_dir"
              fi
            done

            echo "Deploying archive $archive"
            mkdir -m 700 "$stage"
            unzip -q "$remote/$archive" -d "$stage"
            if [ ! -f "$stage/artisan" ] || [ ! -d "$stage/vendor" ] || [ ! -d "$stage/config" ] || [ ! -d "$stage/public" ]; then
              reject "Archive is missing artisan, vendor, config, or public."
            fi
            if [ -d "$stage/bootstrap/cache" ]; then
              for entry in "$stage/bootstrap/cache"/* "$stage/bootstrap/cache"/.[!.]*; do
                if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
                  continue
                fi
                name=${entry##*/}
                if [ "$name" = ".gitignore" ]; then
                  continue
                fi
                rm -rf -- "$entry"
              done
            fi

            if [ -d "$remote/public/storage" ] && [ ! -L "$remote/public/storage" ]; then
              mkdir -p "$remote/storage/app/public"
              cp -a "$remote/public/storage/." "$remote/storage/app/public/"
            fi
            if [ -f "$remote/.user.ini" ]; then
              cp -a "$remote/.user.ini" "$stage/.user.ini"
            fi
            if [ -f "$remote/php.ini" ]; then
              cp -a "$remote/php.ini" "$stage/php.ini"
            fi
            if [ -f "$remote/.php-version" ]; then
              cp -a "$remote/.php-version" "$stage/.php-version"
            fi
            if [ -d "$remote/cgi-bin" ]; then
              rm -rf -- "$stage/cgi-bin"
              cp -a "$remote/cgi-bin" "$stage/cgi-bin"
            fi
            if [ -f "$remote/public/.user.ini" ] && [ -d "$stage/public" ]; then
              cp -a "$remote/public/.user.ini" "$stage/public/.user.ini"
            fi

            # The archive has no .env. Write one from secrets only when the server
            # does not already have one; otherwise hardlink the live file so the
            # only copy is never replaced or deleted.
            old_umask=$(umask)
            umask 077
            secrets_env=$(mktemp)
            chmod 600 "$secrets_env"
            write_secret() {
              # Command substitution would strip a newline, so compare against the
              # value with newlines removed instead of matching a stored newline.
              flattened=$(printf '%s' "$2" | tr -d '\n')
              if [ "$flattened" != "$2" ]; then
                reject "Refusing to write an environment value that contains a newline."
              fi
              printf '%s=%s\n' "$1" "$2" >> "$secrets_env"
            }
            write_secret APP_KEY "$INVESTMENTS_APP_KEY"
            write_secret APP_URL "$INVESTMENTS_APP_URL"
            write_secret ASSET_URL "$INVESTMENTS_ASSET_URL"
            write_secret MARKET_DATA_PROVIDER "$INVESTMENTS_MARKET_DATA_PROVIDER"
            write_secret ALPHAVANTAGE_API_KEY "$INVESTMENTS_ALPHAVANTAGE_API_KEY"
            write_secret FINNHUB_API_KEY "$INVESTMENTS_FINNHUB_API_KEY"
            write_secret ALPACA_API_KEY "$INVESTMENTS_ALPACA_API_KEY"
            write_secret ALPACA_API_SECRET "$INVESTMENTS_ALPACA_API_SECRET"
            write_secret TWELVEDATA_API_SECRET "$INVESTMENTS_TWELVEDATA_API_SECRET"
            write_secret MARKET_DATA_REFRESH "$INVESTMENTS_MARKET_DATA_REFRESH"
            write_secret APP_TIMEZONE "$INVESTMENTS_APP_TIMEZONE"
            write_secret AI_CHAT_ENABLED "$INVESTMENTS_AI_CHAT_ENABLED"
            write_secret CHAT_PROVIDER "$INVESTMENTS_CHAT_PROVIDER"
            write_secret CHAT_MODEL "$INVESTMENTS_CHAT_MODEL"
            write_secret OPENAI_API_KEY "$INVESTMENTS_OPENAI_API_KEY"
            write_secret DAILY_CHANGE_TIME "$INVESTMENTS_DAILY_CHANGE_TIME"
            write_secret REGISTRATION_ENABLED "$INVESTMENTS_REGISTRATION_ENABLED"
            write_secret BASE_CURRENCY "$INVESTMENTS_BASE_CURRENCY"
            write_secret DB_CONNECTION "$INVESTMENTS_DB_CONNECTION"
            write_secret DB_HOST "$INVESTMENTS_DB_HOST"
            write_secret DB_PORT "$INVESTMENTS_DB_PORT"
            write_secret DB_DATABASE "$INVESTMENTS_DB_DATABASE"
            write_secret DB_USERNAME "$INVESTMENTS_DB_USERNAME"
            write_secret DB_PASSWORD "$INVESTMENTS_DB_PASSWORD"
            write_secret CACHE_STORE "$INVESTMENTS_CACHE_STORE"
            write_secret QUEUE_CONNECTION "$INVESTMENTS_QUEUE_CONNECTION"
            write_secret SESSION_DRIVER "$INVESTMENTS_SESSION_DRIVER"
            rm -f -- "$stage/.env"
            if [ -f "$remote/.env" ]; then
              rm -f -- "$secrets_env"
              secrets_env=
              cp -a -l "$remote/.env" "$stage/.env"
              echo "Preserved server .env."
              rm -f -- "$remote/$archive"
            else
              mv -- "$secrets_env" "$stage/.env"
              secrets_env=
              chmod 600 "$stage/.env"
              echo "Wrote .env from secrets."
            fi
            umask "$old_umask"

            if [ -d "$remote/storage" ]; then
              if [ "$stage/storage" = "$remote/storage" ]; then
                reject "Stage storage resolved to the live storage."
              fi
              rm -rf -- "$stage/storage"
              cp -a -l "$remote/storage" "$stage/storage"
              echo "Preserved server storage."
            elif [ ! -d "$stage/storage" ]; then
              reject "No storage directory on the server or in the archive."
            else
              echo "No server storage directory; keeping storage from the archive."
            fi

            mkdir -p \
              "$stage/storage/framework/cache/data" \
              "$stage/storage/framework/sessions" \
              "$stage/storage/framework/views" \
              "$stage/storage/app/public" \
              "$stage/storage/logs" \
              "$stage/bootstrap/cache"
            chmod 600 "$stage/.env"
            chmod -R u+rwX "$stage/storage" "$stage/bootstrap/cache"

            # auth:api builds Passport's resource server before it looks for a
            # token. With no public key that throws LogicException and the API
            # returns 500 instead of 401. Create the pair only when both files
            # are absent; passport:keys without --force exits 1 if either exists.
            if [ -f "$stage/storage/oauth-private.key" ] && [ -f "$stage/storage/oauth-public.key" ]; then
              echo "Passport encryption keys already present."
            elif [ -f "$stage/storage/oauth-private.key" ] || [ -f "$stage/storage/oauth-public.key" ]; then
              reject "Passport key pair is incomplete. Refusing to overwrite an existing key."
            else
              ( cd "$stage" && "$php" artisan passport:keys --no-interaction )
              echo "Created Passport encryption keys."
            fi
            chmod 600 "$stage/storage/oauth-private.key" "$stage/storage/oauth-public.key"
            # New key files exist only in the stage. Sibling rollback restores the
            # previous storage directory, so link them there before the swap.
            # Otherwise the only copy moves aside with the failed tree and the
            # restored site has no key Passport can read.
            if [ -d "$remote/storage" ] && [ "$stage/storage" != "$remote/storage" ]; then
              if [ ! -e "$remote/storage/oauth-private.key" ]; then
                ln -- "$stage/storage/oauth-private.key" "$remote/storage/oauth-private.key"
              fi
              if [ ! -e "$remote/storage/oauth-public.key" ]; then
                ln -- "$stage/storage/oauth-public.key" "$remote/storage/oauth-public.key"
              fi
            fi

            # The stage directory stays 0700 until the tree is complete. LiteSpeed
            # does not run as the account user, so the directory that becomes
            # public_html must be 755. A docroot left at 0700 by the previous
            # deploy is not copied forward.
            doc_mode=$(stat -c '%a' "$remote")
            case $doc_mode in
              700|0700) doc_mode=755 ;;
            esac
            case $doc_mode in
              *1|*3|*5|*7) ;;
              *) doc_mode=755 ;;
            esac

            ensure_docroot_mode() {
              chmod 755 "$remote" || return 1
              mode=$(stat -c '%a' "$remote")
              case $mode in
                755|0755) ;;
                *) echo "Document root mode is $mode, expected 755." >&2; return 1 ;;
              esac
            }

            rollback_swapped_tree() {
              if [ "$use_sibling" = "1" ]; then
                cd "$parent" || return 1
                bad=$parent/.investbrain-failed
                if [ -e "$bad" ]; then
                  aside=$parent/.investbrain-failed-kept
                  if [ -e "$aside" ]; then
                    aside=$parent/.investbrain-failed-$(date +%Y%m%d%H%M%S)
                  fi
                  if [ -e "$aside" ]; then
                    echo "CRITICAL: failed-release directory already exists." >&2
                    return 1
                  fi
                  mv -- "$bad" "$aside" || return 1
                fi
                if [ -d "$remote" ]; then
                  mv -- "$remote" "$bad" || return 1
                fi
                if [ -d "$prev" ]; then
                  if ! mv -- "$prev" "$remote"; then
                    if [ ! -e "$remote" ] && [ -d "$bad" ]; then
                      mv -- "$bad" "$remote" || echo "CRITICAL: live directory was not restored." >&2
                    fi
                    return 1
                  fi
                elif [ ! -e "$remote" ] && [ -d "$bad" ]; then
                  mv -- "$bad" "$remote" || echo "CRITICAL: live directory was not restored." >&2
                  return 1
                fi
                ensure_docroot_mode || return 1
                if [ -d "$bad" ] && [ -f "$remote/.env" ] && [ -d "$remote/storage" ] && [ -f "$bad/.env" ] && [ "$(stat -c '%i' "$bad/.env")" = "$(stat -c '%i' "$remote/.env")" ]; then
                  if find "$bad/storage" -type f -links 1 -print -quit | grep -q .; then
                    echo "Leaving the failed tree in place because storage is not fully linked." >&2
                  else
                    case $bad in
                      */.investbrain-failed) rm -rf -- "$bad" ;;
                      *) echo "Refusing to delete an unexpected path." >&2; return 1 ;;
                    esac
                  fi
                fi
              else
                phase=moving-new
                restore_inplace
                ensure_docroot_mode || return 1
              fi
            }

            if [ "$use_sibling" = "1" ]; then
              chmod "$doc_mode" "$stage"
              cd "$parent"
              phase=swapping
              mv -- "$remote" "$prev"
              if ! mv -- "$stage" "$remote"; then
                mv -- "$prev" "$remote" || echo "CRITICAL: live directory was not restored." >&2
                exit 1
              fi
            else
              phase=moving-old
              mkdir -m 700 "$prev"
              move_dest=$prev
              move_unpreserved "$remote"
              : > "$prev/.release-names"
              for entry in "$stage"/* "$stage"/.[!.]* "$stage"/..?*; do
                if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
                  continue
                fi
                name=${entry##*/}
                if is_preserved_name "$name"; then
                  continue
                fi
                printf '%s\n' "$name" >> "$prev/.release-names"
              done
              phase=moving-new
              move_dest=$remote
              move_unpreserved "$stage"
            fi

            chmod "$doc_mode" "$remote"
            final_mode=$(stat -c '%a' "$remote")
            case $final_mode in
              755|0755) ;;
              *)
                echo "Document root mode is $final_mode, expected 755. Rolling back." >&2
                rollback_swapped_tree || echo "CRITICAL: rollback failed." >&2
                phase=live
                exit 1
                ;;
            esac
            echo "Document root mode is $final_mode."

            swapped=1
            phase=live
            if [ -d "$stage" ]; then
              if [ ! -f "$remote/.env" ] || [ ! -d "$remote/storage" ]; then
                reject "Refusing to discard stage because live .env or storage is missing."
              fi
              assert_work_dir "$stage"
              rm -rf -- "$stage"
            fi
            cd "$remote"
            mkdir -p \
              storage/framework/cache/data \
              storage/framework/sessions \
              storage/framework/views \
              storage/app/public \
              storage/logs \
              bootstrap/cache
            if [ -f "$remote/$archive" ]; then
              rm -f -- "$remote/$archive"
            fi
            if [ -f "$prev/$archive" ]; then
              rm -f -- "$prev/$archive"
            fi
            chmod 600 .env
            "$php" artisan optimize:clear
            "$php" artisan migrate --force
            "$php" artisan storage:link --relative --force
            "$php" artisan config:cache
            "$php" artisan route:cache
            "$php" artisan event:cache
            chmod 600 .env bootstrap/cache/config.php
            if [ ! -f "$remote/.env" ] || [ ! -d "$remote/storage" ]; then
              reject "Live .env or storage disappeared before cleanup."
            fi
            echo "Swapped application tree."
            echo "Previous tree kept until HTTP checks pass."

      - name: Verify public site
        id: verify
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          base="https://investments.alebatistella.com"
          login_code=""
          dividend_code=""
          # A repo secret contains the digits 30, so Actions prints 302 as ***2.
          # Space the digits in the log. Comparisons still use the raw code.
          show_code() {
            printf '%s' "$1" | sed 's/./& /g'
          }
          for attempt in 1 2 3 4 5 6; do
            login_code="$(curl -sS -o /tmp/login.html -w '%{http_code}' --max-time 30 "${base}/login" || true)"
            # auth:api redirects a browser request to /login (302). The API
            # returns 401 only when the request expects JSON. Do not follow it.
            dividend_code="$(curl -sS -o /tmp/dividend.body -w '%{http_code}' --max-time 30 \
              -H 'Accept: application/json' \
              -H 'X-Requested-With: XMLHttpRequest' \
              "${base}/api/dividend" || true)"
            echo "attempt=${attempt} source=${SOURCE_SHA} login_http=$(show_code "$login_code") dividend_http=$(show_code "$dividend_code")"
            if [[ "${login_code}" == "200" && "${dividend_code}" == "401" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "${login_code}" != "200" ]]; then
            echo "Login page returned HTTP $(show_code "$login_code"), expected 2 0 0." >&2
            exit 1
          fi
          if ! grep -qiE 'type="password"|name="password"' /tmp/login.html; then
            echo "Login response was HTTP 200 but had no password field." >&2
            exit 1
          fi
          if [[ "${dividend_code}" != "401" ]]; then
            echo "GET /api/dividend returned HTTP $(show_code "$dividend_code"), expected 4 0 1." >&2
            exit 1
          fi
          echo "Public checks passed for ${SOURCE_SHA}."

      - name: Remove previous release
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          INVESTMENTS_SSH_REMOTE_PATH: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          command_timeout: 10m
          script_stop: true
          envs: INVESTMENTS_SSH_REMOTE_PATH
          script: |
            set -eu
            remote=$INVESTMENTS_SSH_REMOTE_PATH
            case $remote in
              /[A-Za-z0-9._/-]*) ;;
              *) echo "Remote path is not an absolute path with safe characters." >&2; exit 1 ;;
            esac
            case $remote in
              *..*|*/) echo "Remote path is not allowed." >&2; exit 1 ;;
            esac
            if [ ! -d "$remote" ] || [ -L "$remote" ]; then
              echo "Remote path is not a real directory." >&2
              exit 1
            fi
            parent=$(dirname "$remote")
            if [ -d "$parent/.investbrain-previous" ]; then
              prev=$parent/.investbrain-previous
            elif [ -d "$remote/.investbrain-previous" ]; then
              prev=$remote/.investbrain-previous
            else
              echo "No previous tree to remove."
              exit 0
            fi
            case $prev in
              */.investbrain-previous) ;;
              *) echo "Refusing to delete an unexpected path." >&2; exit 1 ;;
            esac
            if [ -f "$prev/.env" ]; then
              if [ ! -f "$remote/.env" ]; then
                echo "Previous tree has .env but the live tree does not." >&2
                exit 1
              fi
              if [ "$(stat -c '%i' "$prev/.env")" != "$(stat -c '%i' "$remote/.env")" ]; then
                echo "Previous .env is not the live server .env." >&2
                exit 1
              fi
              rm -f -- "$prev/.env"
            fi
            # Same rule as discard_previous in the swap step. optimize:clear
            # leaves compiled views and file cache only in this tree. Logs,
            # sessions, cache, and views may be removed. Passport keys, uploads,
            # and any other unique file must not.
            unique_storage_files() {
              dir=$1
              shift
              find "$dir" -type f -links 1 \
                ! -path '*/storage/logs/*' \
                ! -path '*/storage/framework/cache/*' \
                ! -path '*/storage/framework/sessions/*' \
                ! -path '*/storage/framework/views/*' \
                "$@"
            }
            if [ -e "$prev/storage" ]; then
              if [ ! -d "$remote/storage" ]; then
                echo "Previous tree has storage but the live tree does not." >&2
                exit 1
              fi
              if unique_storage_files "$prev/storage" -print -quit | grep -q .; then
                echo "Previous storage has a file that is not linked into the live tree:" >&2
                unique_storage_files "$prev/storage" -printf '%P\n' >&2
                exit 1
              fi
              rm -rf -- "$prev/storage"
            fi
            if [ -e "$prev/.env" ] || [ -e "$prev/storage" ]; then
              echo "Previous tree still holds .env or storage." >&2
              exit 1
            fi
            rm -rf -- "$prev"
            echo "Removed previous release."

      # Cleanup above runs only after Verify passes. A failure there must
      # leave the new release in place. Rollback runs only when Verify failed.
      - name: Roll back previous release
        if: ${{ failure() && steps.swap.outcome == 'success' && steps.verify.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          INVESTMENTS_SSH_REMOTE_PATH: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          command_timeout: 10m
          script_stop: true
          envs: INVESTMENTS_SSH_REMOTE_PATH
          script: |
            set -eu
            remote=$INVESTMENTS_SSH_REMOTE_PATH
            case $remote in
              /[A-Za-z0-9._/-]*) ;;
              *) echo "Remote path is not an absolute path with safe characters." >&2; exit 1 ;;
            esac
            case $remote in
              *..*|*/) echo "Remote path is not allowed." >&2; exit 1 ;;
            esac
            if [ ! -d "$remote" ] || [ -L "$remote" ]; then
              echo "Remote path is not a real directory." >&2
              exit 1
            fi
            parent=$(dirname "$remote")

            # The new tree is still the docroot. Show why the HTTP check failed
            # before moving it aside. Redact the account path and secret-shaped values.
            print_laravel_log() {
              logdir=$remote/storage/logs
              if [ ! -d "$logdir" ]; then
                echo "No Laravel log directory." >&2
                return 0
              fi
              log=$(find "$logdir" -maxdepth 1 -type f -name 'laravel*.log' -printf '%T@\t%p\n' 2>/dev/null | sort -n | tail -1 | cut -f2-)
              if [ -z "$log" ]; then
                echo "No laravel log file." >&2
                return 0
              fi
              echo "Laravel log tail (${log##*/}):"
              # mawk's sub() mis-handles replacements, so redact with the shell and sed.
              tail -n 80 "$log" | while IFS= read -r line || [ -n "$line" ]; do
                while [ "${line#*"$remote"}" != "$line" ]; do
                  line="${line%%"$remote"*}[docroot]${line#*"$remote"}"
                done
                case $line in
                  *'PRIVATE KEY'*|*'BEGIN OPENSSH'*|*'BEGIN RSA'*)
                    printf '%s\n' '[redacted key material]'
                    continue
                    ;;
                esac
                line=$(printf '%s\n' "$line" | sed -E 's/[Bb]earer[[:space:]]+[^[:space:]]+/Bearer <redacted>/')
                line=$(printf '%s\n' "$line" | sed -E 's/([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|[Aa][Pp][Ii]_[Kk][Ee][Yy]|[Aa][Pp][Pp]_[Kk][Ee][Yy]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn])([^[:space:]]{0,3}[:=][[:space:]]*).*/\1\2<redacted>/')
                line=$(printf '%s\n' "$line" | sed -E 's/base64:[A-Za-z0-9+/=_-]+/base64:<redacted>/')
                line=$(printf '%s\n' "$line" | sed -E 's#mysql://[^[:space:]]+#mysql://<redacted>#')
                printf '%s\n' "$line"
              done
            }
            print_laravel_log || echo "Could not read the Laravel log." >&2

            ensure_docroot_mode() {
              chmod 755 "$remote" || return 1
              mode=$(stat -c '%a' "$remote")
              case $mode in
                755|0755) echo "Document root mode is $mode." ;;
                *) echo "Document root mode is $mode, expected 755." >&2; return 1 ;;
              esac
            }

            if [ -d "$parent/.investbrain-previous" ] && [ -f "$parent/.investbrain-previous/artisan" ]; then
              prev=$parent/.investbrain-previous
              bad=$parent/.investbrain-failed
              if [ -e "$bad" ]; then
                aside=$parent/.investbrain-failed-kept
                if [ -e "$aside" ]; then
                  aside=$parent/.investbrain-failed-$(date +%Y%m%d%H%M%S)
                fi
                if [ -e "$aside" ]; then
                  echo "CRITICAL: failed-release directory already exists." >&2
                  exit 1
                fi
                mv -- "$bad" "$aside"
                echo "Moved the previous failed tree aside."
              fi
              cd "$parent"
              mv -- "$remote" "$bad"
              if ! mv -- "$prev" "$remote"; then
                mv -- "$bad" "$remote" || echo "CRITICAL: live directory was not restored." >&2
                ensure_docroot_mode || true
                exit 1
              fi
              ensure_docroot_mode
              if [ -f "$bad/.env" ] && [ -f "$remote/.env" ] && [ "$(stat -c '%i' "$bad/.env")" = "$(stat -c '%i' "$remote/.env")" ] && [ -d "$bad/storage" ] && [ -d "$remote/storage" ]; then
                if find "$bad/storage" -type f -links 1 -print -quit | grep -q .; then
                  echo "Rolled back. Leaving the failed tree because storage is not fully linked." >&2
                  exit 0
                fi
                case $bad in
                  */.investbrain-failed) rm -rf -- "$bad" ;;
                  *) echo "Refusing to delete an unexpected path." >&2; exit 1 ;;
                esac
              fi
              echo "Rolled back to the previous tree."
              exit 0
            fi
            if [ -d "$remote/.investbrain-previous" ] && [ -f "$remote/.investbrain-previous/artisan" ]; then
              prev=$remote/.investbrain-previous
              case $prev in
                */.investbrain-previous) ;;
                *) echo "Refusing to restore from an unexpected path." >&2; exit 1 ;;
              esac
              if [ -f "$prev/.release-names" ]; then
                while IFS= read -r name; do
                  case $name in
                    ''|.|..|*/*|*..*|.env|storage) continue ;;
                  esac
                  if [ -e "$remote/$name" ] || [ -L "$remote/$name" ]; then
                    rm -rf -- "$remote/$name"
                  fi
                done < "$prev/.release-names"
              fi
              for entry in "$prev"/* "$prev"/.[!.]* "$prev"/..?*; do
                if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
                  continue
                fi
                name=${entry##*/}
                case $name in
                  .|..|.env|storage|.release-names) continue ;;
                esac
                mv -- "$entry" "$remote/"
              done
              if [ ! -e "$prev/.env" ] && [ ! -e "$prev/storage" ]; then
                rm -rf -- "$prev"
              fi
              ensure_docroot_mode
              echo "Rolled back to the previous tree."
              exit 0
            fi
            ensure_docroot_mode || true
            echo "No previous tree to restore." >&2
            exit 1
