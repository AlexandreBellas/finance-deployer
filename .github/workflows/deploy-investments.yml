# Manual only. Do not add push, pull_request, or schedule triggers.
# The site and secrets do not exist yet, so a push must not deploy.

name: Deploy Investments

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/investbrainapp/investbrain/releases/latest \
            | jq -er .tag_name)"
          if [[ ! "${tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unexpected release tag: ${tag}" >&2
            exit 1
          fi
          mkdir -p build
          curl -fL --retry 3 --retry-delay 2 -o build/source.zip \
            "https://github.com/investbrainapp/investbrain/archive/refs/tags/${tag}.zip"
          {
            echo "tag=${tag}"
            echo "archive=Investments-${tag}.zip"
          } >> "${GITHUB_OUTPUT}"

      # v1.3.1 locks Symfony 8.1, which requires PHP >= 8.4.1.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, sodium, tokenizer, xml, zip
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and build assets
        env:
          COMPOSER_MEMORY_LIMIT: "-1"
          COMPOSER_NO_INTERACTION: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          rm -rf build/extract build/app
          unzip -q build/source.zip -d build/extract
          mapfile -t src_dirs < <(find build/extract -mindepth 1 -maxdepth 1 -type d | sort)
          if [[ "${#src_dirs[@]}" -ne 1 ]]; then
            echo "Expected one top-level directory in the release archive, found ${#src_dirs[@]}." >&2
            exit 1
          fi
          mv "${src_dirs[0]}" build/app
          cd build/app
          composer install --no-dev --no-scripts --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
          rm -rf node_modules tests docker
          rm -f public/hot

      - name: Fill .env from secrets
        working-directory: build/app
        run: |
          set -euo pipefail
          {
            echo APP_NAME="${{ secrets.INVESTMENTS_APP_NAME }}"
            echo APP_ENV="${{ secrets.INVESTMENTS_APP_ENV }}"
            echo APP_KEY="${{ secrets.INVESTMENTS_APP_KEY }}"
            echo APP_DEBUG="${{ secrets.INVESTMENTS_APP_DEBUG }}"
            echo APP_URL="${{ secrets.INVESTMENTS_APP_URL }}"
            echo ASSET_URL="${{ secrets.INVESTMENTS_ASSET_URL }}"
            echo APP_TIMEZONE="${{ secrets.INVESTMENTS_APP_TIMEZONE }}"
            echo APP_LOCALE="${{ secrets.INVESTMENTS_APP_LOCALE }}"
            echo SELF_HOSTED="${{ secrets.INVESTMENTS_SELF_HOSTED }}"
            echo REGISTRATION_ENABLED="${{ secrets.INVESTMENTS_REGISTRATION_ENABLED }}"
            echo AI_CHAT_ENABLED="${{ secrets.INVESTMENTS_AI_CHAT_ENABLED }}"
            echo LOG_CHANNEL="${{ secrets.INVESTMENTS_LOG_CHANNEL }}"
            echo LOG_LEVEL="${{ secrets.INVESTMENTS_LOG_LEVEL }}"
            echo FILESYSTEM_DISK="${{ secrets.INVESTMENTS_FILESYSTEM_DISK }}"
            echo SESSION_DRIVER="${{ secrets.INVESTMENTS_SESSION_DRIVER }}"
            echo QUEUE_CONNECTION="${{ secrets.INVESTMENTS_QUEUE_CONNECTION }}"
            echo CACHE_STORE="${{ secrets.INVESTMENTS_CACHE_STORE }}"
            echo DB_CONNECTION="${{ secrets.INVESTMENTS_DB_CONNECTION }}"
            echo DB_HOST="${{ secrets.INVESTMENTS_DB_HOST }}"
            echo DB_PORT="${{ secrets.INVESTMENTS_DB_PORT }}"
            echo DB_DATABASE="${{ secrets.INVESTMENTS_DB_DATABASE }}"
            echo DB_USERNAME="${{ secrets.INVESTMENTS_DB_USERNAME }}"
            echo DB_PASSWORD="${{ secrets.INVESTMENTS_DB_PASSWORD }}"
            echo MARKET_DATA_PROVIDER="${{ secrets.INVESTMENTS_MARKET_DATA_PROVIDER }}"
            echo MARKET_DATA_REFRESH="${{ secrets.INVESTMENTS_MARKET_DATA_REFRESH }}"
            echo BASE_CURRENCY="${{ secrets.INVESTMENTS_BASE_CURRENCY }}"
            echo MAIL_MAILER="${{ secrets.INVESTMENTS_MAIL_MAILER }}"
            echo MAIL_FROM_ADDRESS="${{ secrets.INVESTMENTS_MAIL_FROM_ADDRESS }}"
            echo MAIL_FROM_NAME="${{ secrets.INVESTMENTS_MAIL_FROM_NAME }}"
            echo DAILY_CHANGE_TIME="${{ secrets.INVESTMENTS_DAILY_CHANGE_TIME }}"
            echo ALPHAVANTAGE_API_KEY="${{ secrets.INVESTMENTS_ALPHAVANTAGE_API_KEY }}"
            echo FINNHUB_API_KEY="${{ secrets.INVESTMENTS_FINNHUB_API_KEY }}"
            echo ALPACA_API_KEY="${{ secrets.INVESTMENTS_ALPACA_API_KEY }}"
            echo ALPACA_API_SECRET="${{ secrets.INVESTMENTS_ALPACA_API_SECRET }}"
            echo TWELVEDATA_API_SECRET="${{ secrets.INVESTMENTS_TWELVEDATA_API_SECRET }}"
            echo CHAT_PROVIDER="${{ secrets.INVESTMENTS_CHAT_PROVIDER }}"
            echo CHAT_MODEL="${{ secrets.INVESTMENTS_CHAT_MODEL }}"
            echo OPENAI_API_KEY="${{ secrets.INVESTMENTS_OPENAI_API_KEY }}"
            echo MAIL_HOST="${{ secrets.INVESTMENTS_MAIL_HOST }}"
            echo MAIL_PORT="${{ secrets.INVESTMENTS_MAIL_PORT }}"
            echo MAIL_USERNAME="${{ secrets.INVESTMENTS_MAIL_USERNAME }}"
            echo MAIL_PASSWORD="${{ secrets.INVESTMENTS_MAIL_PASSWORD }}"
            echo MAIL_ENCRYPTION="${{ secrets.INVESTMENTS_MAIL_ENCRYPTION }}"
          } > .env
          chmod 600 .env

      - name: Discover packages
        run: |
          set -euo pipefail
          mkdir -p \
            build/app/storage/framework/cache/data \
            build/app/storage/framework/sessions \
            build/app/storage/framework/views \
            build/app/storage/app/public \
            build/app/storage/logs \
            build/app/bootstrap/cache
          cd build/app
          php artisan package:discover --ansi
          php artisan filament:upgrade

      - name: Add root .htaccess and zip
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          cp .htaccess build/app/.htaccess
          rm -rf release
          mkdir -p release
          (
            cd build/app
            zip -qr "../../release/${ARCHIVE:?}" .
          )

      - name: Upload via FTP
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.INVESTMENTS_FTP_SERVER }}
          user: ${{ secrets.INVESTMENTS_FTP_USERNAME }}
          password: ${{ secrets.INVESTMENTS_FTP_PASSWORD }}
          local_dir: "./release"
          ssl_check_hostname: "false"

      - name: Unzip, migrate, and cache
        uses: appleboy/ssh-action@master
        env:
          INVESTMENTS_SSH_REMOTE_PATH: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
          INVESTMENTS_PHP_BIN: ${{ secrets.INVESTMENTS_PHP_BIN }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          command_timeout: 30m
          script_stop: true
          envs: INVESTMENTS_SSH_REMOTE_PATH,INVESTMENTS_PHP_BIN,ARCHIVE
          script: |
            set -eu
            cd "$INVESTMENTS_SSH_REMOTE_PATH"
            unzip -o "$ARCHIVE"
            rm -f "$ARCHIVE"
            chmod 600 .env
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/logs bootstrap/cache
            chmod -R u+rwX storage bootstrap/cache
            "$INVESTMENTS_PHP_BIN" artisan migrate --force
            "$INVESTMENTS_PHP_BIN" artisan storage:link --relative --force
            "$INVESTMENTS_PHP_BIN" artisan optimize:clear
            "$INVESTMENTS_PHP_BIN" artisan config:cache
            "$INVESTMENTS_PHP_BIN" artisan route:cache
            "$INVESTMENTS_PHP_BIN" artisan event:cache
            chmod 600 .env bootstrap/cache/config.php
