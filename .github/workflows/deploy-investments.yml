# Manual only. Do not add push, pull_request, or schedule triggers.
# The site and secrets do not exist yet, so a push must not deploy.

name: Deploy Investments

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets and write .env
        env:
          INVESTMENTS_FTP_SERVER: ${{ secrets.INVESTMENTS_FTP_SERVER }}
          INVESTMENTS_FTP_USERNAME: ${{ secrets.INVESTMENTS_FTP_USERNAME }}
          INVESTMENTS_FTP_PASSWORD: ${{ secrets.INVESTMENTS_FTP_PASSWORD }}
          INVESTMENTS_SSH_REMOTE_HOST: ${{ secrets.INVESTMENTS_SSH_REMOTE_HOST }}
          INVESTMENTS_SSH_REMOTE_USER: ${{ secrets.INVESTMENTS_SSH_REMOTE_USER }}
          INVESTMENTS_SSH_REMOTE_PASSWORD: ${{ secrets.INVESTMENTS_SSH_REMOTE_PASSWORD }}
          INVESTMENTS_SSH_REMOTE_PORT: ${{ secrets.INVESTMENTS_SSH_REMOTE_PORT }}
          INVESTMENTS_SSH_REMOTE_PATH: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
          INVESTMENTS_PHP_BIN: ${{ secrets.INVESTMENTS_PHP_BIN }}
          INVESTMENTS_APP_NAME: ${{ secrets.INVESTMENTS_APP_NAME }}
          INVESTMENTS_APP_ENV: ${{ secrets.INVESTMENTS_APP_ENV }}
          INVESTMENTS_APP_KEY: ${{ secrets.INVESTMENTS_APP_KEY }}
          INVESTMENTS_APP_DEBUG: ${{ secrets.INVESTMENTS_APP_DEBUG }}
          INVESTMENTS_APP_URL: ${{ secrets.INVESTMENTS_APP_URL }}
          INVESTMENTS_ASSET_URL: ${{ secrets.INVESTMENTS_ASSET_URL }}
          INVESTMENTS_APP_TIMEZONE: ${{ secrets.INVESTMENTS_APP_TIMEZONE }}
          INVESTMENTS_APP_LOCALE: ${{ secrets.INVESTMENTS_APP_LOCALE }}
          INVESTMENTS_SELF_HOSTED: ${{ secrets.INVESTMENTS_SELF_HOSTED }}
          INVESTMENTS_REGISTRATION_ENABLED: ${{ secrets.INVESTMENTS_REGISTRATION_ENABLED }}
          INVESTMENTS_AI_CHAT_ENABLED: ${{ secrets.INVESTMENTS_AI_CHAT_ENABLED }}
          INVESTMENTS_LOG_CHANNEL: ${{ secrets.INVESTMENTS_LOG_CHANNEL }}
          INVESTMENTS_LOG_LEVEL: ${{ secrets.INVESTMENTS_LOG_LEVEL }}
          INVESTMENTS_FILESYSTEM_DISK: ${{ secrets.INVESTMENTS_FILESYSTEM_DISK }}
          INVESTMENTS_SESSION_DRIVER: ${{ secrets.INVESTMENTS_SESSION_DRIVER }}
          INVESTMENTS_QUEUE_CONNECTION: ${{ secrets.INVESTMENTS_QUEUE_CONNECTION }}
          INVESTMENTS_CACHE_STORE: ${{ secrets.INVESTMENTS_CACHE_STORE }}
          INVESTMENTS_DB_CONNECTION: ${{ secrets.INVESTMENTS_DB_CONNECTION }}
          INVESTMENTS_DB_HOST: ${{ secrets.INVESTMENTS_DB_HOST }}
          INVESTMENTS_DB_PORT: ${{ secrets.INVESTMENTS_DB_PORT }}
          INVESTMENTS_DB_DATABASE: ${{ secrets.INVESTMENTS_DB_DATABASE }}
          INVESTMENTS_DB_USERNAME: ${{ secrets.INVESTMENTS_DB_USERNAME }}
          INVESTMENTS_DB_PASSWORD: ${{ secrets.INVESTMENTS_DB_PASSWORD }}
          INVESTMENTS_MARKET_DATA_PROVIDER: ${{ secrets.INVESTMENTS_MARKET_DATA_PROVIDER }}
          INVESTMENTS_MARKET_DATA_REFRESH: ${{ secrets.INVESTMENTS_MARKET_DATA_REFRESH }}
          INVESTMENTS_BASE_CURRENCY: ${{ secrets.INVESTMENTS_BASE_CURRENCY }}
          INVESTMENTS_MAIL_MAILER: ${{ secrets.INVESTMENTS_MAIL_MAILER }}
          INVESTMENTS_MAIL_FROM_ADDRESS: ${{ secrets.INVESTMENTS_MAIL_FROM_ADDRESS }}
          INVESTMENTS_MAIL_FROM_NAME: ${{ secrets.INVESTMENTS_MAIL_FROM_NAME }}
          INVESTMENTS_DAILY_CHANGE_TIME: ${{ secrets.INVESTMENTS_DAILY_CHANGE_TIME }}
          INVESTMENTS_ALPHAVANTAGE_API_KEY: ${{ secrets.INVESTMENTS_ALPHAVANTAGE_API_KEY }}
          INVESTMENTS_FINNHUB_API_KEY: ${{ secrets.INVESTMENTS_FINNHUB_API_KEY }}
          INVESTMENTS_ALPACA_API_KEY: ${{ secrets.INVESTMENTS_ALPACA_API_KEY }}
          INVESTMENTS_ALPACA_API_SECRET: ${{ secrets.INVESTMENTS_ALPACA_API_SECRET }}
          INVESTMENTS_TWELVEDATA_API_SECRET: ${{ secrets.INVESTMENTS_TWELVEDATA_API_SECRET }}
          INVESTMENTS_CHAT_PROVIDER: ${{ secrets.INVESTMENTS_CHAT_PROVIDER }}
          INVESTMENTS_CHAT_MODEL: ${{ secrets.INVESTMENTS_CHAT_MODEL }}
          INVESTMENTS_OPENAI_API_KEY: ${{ secrets.INVESTMENTS_OPENAI_API_KEY }}
          INVESTMENTS_MAIL_HOST: ${{ secrets.INVESTMENTS_MAIL_HOST }}
          INVESTMENTS_MAIL_PORT: ${{ secrets.INVESTMENTS_MAIL_PORT }}
          INVESTMENTS_MAIL_USERNAME: ${{ secrets.INVESTMENTS_MAIL_USERNAME }}
          INVESTMENTS_MAIL_PASSWORD: ${{ secrets.INVESTMENTS_MAIL_PASSWORD }}
          INVESTMENTS_MAIL_ENCRYPTION: ${{ secrets.INVESTMENTS_MAIL_ENCRYPTION }}
        run: bash deploy/fill-env.sh "${RUNNER_TEMP:?}/investments.env"

      - name: Download latest release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/investbrainapp/investbrain/releases/latest \
            | jq -er .tag_name)"
          if [[ ! "${tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unexpected release tag: ${tag}" >&2
            exit 1
          fi
          mkdir -p build
          curl -fL --retry 3 --retry-delay 2 -o build/source.zip \
            "https://github.com/investbrainapp/investbrain/archive/refs/tags/${tag}.zip"
          {
            echo "tag=${tag}"
            echo "archive=Investments-${tag}.zip"
          } >> "${GITHUB_OUTPUT}"

      # v1.3.1 locks Symfony 8.1, which requires PHP >= 8.4.1.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, sodium, tokenizer, xml, zip
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and build assets
        env:
          COMPOSER_MEMORY_LIMIT: "-1"
          COMPOSER_NO_INTERACTION: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          rm -rf build/extract build/app
          unzip -q build/source.zip -d build/extract
          mapfile -t src_dirs < <(find build/extract -mindepth 1 -maxdepth 1 -type d | sort)
          if [[ "${#src_dirs[@]}" -ne 1 ]]; then
            echo "Expected one top-level directory in the release archive, found ${#src_dirs[@]}." >&2
            exit 1
          fi
          mv "${src_dirs[0]}" build/app
          cd build/app
          composer install --no-dev --no-scripts --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
          rm -rf node_modules tests docker
          rm -f public/hot

      - name: Discover packages
        run: |
          set -euo pipefail
          mv "${RUNNER_TEMP:?}/investments.env" build/app/.env
          chmod 600 build/app/.env
          mkdir -p \
            build/app/storage/framework/cache/data \
            build/app/storage/framework/sessions \
            build/app/storage/framework/views \
            build/app/storage/app/public \
            build/app/storage/logs \
            build/app/bootstrap/cache
          cd build/app
          php artisan package:discover --ansi
          php artisan filament:upgrade

      - name: Add root .htaccess and zip
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          cp deploy/root.htaccess build/app/.htaccess
          rm -rf release
          mkdir -p release
          (
            cd build/app
            zip -qr "../../release/${ARCHIVE:?}" .
          )

      - name: Upload via FTP
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.INVESTMENTS_FTP_SERVER }}
          user: ${{ secrets.INVESTMENTS_FTP_USERNAME }}
          password: ${{ secrets.INVESTMENTS_FTP_PASSWORD }}
          local_dir: "./release"
          ssl_check_hostname: "false"

      - name: Unzip, migrate, and cache
        uses: appleboy/ssh-action@master
        env:
          INVESTMENTS_SSH_REMOTE_PATH: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
          INVESTMENTS_PHP_BIN: ${{ secrets.INVESTMENTS_PHP_BIN }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        with:
          host: ${{ secrets.INVESTMENTS_SSH_REMOTE_HOST }}
          username: ${{ secrets.INVESTMENTS_SSH_REMOTE_USER }}
          password: ${{ secrets.INVESTMENTS_SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.INVESTMENTS_SSH_REMOTE_PORT }}
          command_timeout: 30m
          script_stop: true
          envs: INVESTMENTS_SSH_REMOTE_PATH,INVESTMENTS_PHP_BIN,ARCHIVE
          script: |
            set -eu
            cd "$INVESTMENTS_SSH_REMOTE_PATH"
            unzip -o "$ARCHIVE"
            rm -f "$ARCHIVE"
            chmod 600 .env
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/logs bootstrap/cache
            chmod -R u+rwX storage bootstrap/cache
            "$INVESTMENTS_PHP_BIN" artisan migrate --force
            "$INVESTMENTS_PHP_BIN" artisan storage:link --relative --force
            "$INVESTMENTS_PHP_BIN" artisan optimize:clear
            "$INVESTMENTS_PHP_BIN" artisan config:cache
            "$INVESTMENTS_PHP_BIN" artisan route:cache
            "$INVESTMENTS_PHP_BIN" artisan event:cache
            chmod 600 .env bootstrap/cache/config.php
