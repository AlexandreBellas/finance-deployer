# Manual only. Do not add push, pull_request, or schedule triggers.
# Source is AlexandreBellas/investbrain, not upstream investbrainapp/investbrain releases.
# Default ref is that fork's main HEAD, resolved to a commit SHA before download.

name: Deploy Investments

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA on AlexandreBellas/investbrain. Empty deploys main HEAD."
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve fork commit and download source
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env so the value is never interpolated into the script.
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          repo="AlexandreBellas/investbrain"
          ref="${REQUESTED_REF:-}"
          if [[ -z "${ref}" ]]; then
            ref="main"
          fi
          if [[ "${#ref}" -gt 255 || ! "${ref}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Ref may only contain letters, numbers, and the characters . _ / - (max 255)." >&2
            exit 1
          fi
          IFS='/' read -ra ref_parts <<< "${ref}"
          if [[ "${#ref_parts[@]}" -eq 0 ]]; then
            echo "Ref is not a valid git ref." >&2
            exit 1
          fi
          for part in "${ref_parts[@]}"; do
            if [[ -z "${part}" || "${part}" == "." || "${part}" == ".." ]]; then
              echo "Ref is not a valid git ref." >&2
              exit 1
            fi
          done

          echo "Resolving ${repo} ref ${ref}"
          encoded="$(jq -rn --arg r "${ref}" '$r|@uri')"
          sha="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${repo}/commits/${encoded}" \
            | jq -er '.sha')"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return a full commit SHA." >&2
            exit 1
          fi
          # A hex-only ref is a SHA. Require GitHub to return that commit.
          if [[ "${ref}" =~ ^[0-9a-fA-F]+$ ]]; then
            wanted="$(printf '%s' "${ref}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${#wanted}" -lt 7 || "${sha}" != "${wanted}"* ]]; then
              echo "Resolved commit does not match the requested SHA." >&2
              exit 1
            fi
          fi

          mkdir -p build
          curl -fL --retry 3 --retry-delay 2 -o build/source.zip \
            "https://github.com/${repo}/archive/${sha}.zip"
          {
            echo "sha=${sha}"
            echo "archive=Investments-${sha}.zip"
          } >> "${GITHUB_OUTPUT}"
          echo "Source commit: ${sha}"
          echo "Archive: Investments-${sha}.zip"
          {
            echo "### Investbrain source"
            echo ""
            echo "- Repository: \`${repo}\`"
            echo "- Requested ref: \`${ref}\`"
            echo "- Commit: \`${sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The fork's composer.json requires PHP ^8.4.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, sodium, tokenizer, xml, zip
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and build assets
        env:
          COMPOSER_MEMORY_LIMIT: "-1"
          COMPOSER_NO_INTERACTION: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          rm -rf build/extract build/app
          unzip -q build/source.zip -d build/extract
          mapfile -t src_dirs < <(find build/extract -mindepth 1 -maxdepth 1 -type d | sort)
          if [[ "${#src_dirs[@]}" -ne 1 ]]; then
            echo "Expected one top-level directory in the release archive, found ${#src_dirs[@]}." >&2
            exit 1
          fi
          mv "${src_dirs[0]}" build/app
          cd build/app
          composer install --no-dev --no-scripts --optimize-autoloader --no-interaction --prefer-dist
          npm ci
          npm run build
          rm -rf node_modules tests docker
          rm -f public/hot

      # Workaround until upstream fixes the GROUP BY in Holding::scopeGetPortfolioMetrics; remove this step then.
      - name: Patch MySQL sql_mode (drop ONLY_FULL_GROUP_BY)
        working-directory: build/app
        run: |
          set -euo pipefail
          sed -i "s/'strict' => true,/'strict' => true,\n            'modes' => ['STRICT_TRANS_TABLES', 'NO_ZERO_IN_DATE', 'NO_ZERO_DATE', 'ERROR_FOR_DIVISION_BY_ZERO', 'NO_ENGINE_SUBSTITUTION'],/" config/database.php
          grep -q "'modes' =>" config/database.php || { echo "strict-mode patch did not apply"; exit 1; }

      - name: Fill .env from secrets
        working-directory: build/app
        run: |
          set -euo pipefail
          {
            echo APP_KEY="${{ secrets.INVESTMENTS_APP_KEY }}"
            echo APP_URL="${{ secrets.INVESTMENTS_APP_URL }}"
            echo ASSET_URL="${{ secrets.INVESTMENTS_ASSET_URL }}"
            echo MARKET_DATA_PROVIDER="${{ secrets.INVESTMENTS_MARKET_DATA_PROVIDER }}"
            echo ALPHAVANTAGE_API_KEY="${{ secrets.INVESTMENTS_ALPHAVANTAGE_API_KEY }}"
            echo FINNHUB_API_KEY="${{ secrets.INVESTMENTS_FINNHUB_API_KEY }}"
            echo ALPACA_API_KEY="${{ secrets.INVESTMENTS_ALPACA_API_KEY }}"
            echo ALPACA_API_SECRET="${{ secrets.INVESTMENTS_ALPACA_API_SECRET }}"
            echo TWELVEDATA_API_SECRET="${{ secrets.INVESTMENTS_TWELVEDATA_API_SECRET }}"
            echo MARKET_DATA_REFRESH="${{ secrets.INVESTMENTS_MARKET_DATA_REFRESH }}"
            echo APP_TIMEZONE="${{ secrets.INVESTMENTS_APP_TIMEZONE }}"
            echo AI_CHAT_ENABLED="${{ secrets.INVESTMENTS_AI_CHAT_ENABLED }}"
            echo CHAT_PROVIDER="${{ secrets.INVESTMENTS_CHAT_PROVIDER }}"
            echo CHAT_MODEL="${{ secrets.INVESTMENTS_CHAT_MODEL }}"
            echo OPENAI_API_KEY="${{ secrets.INVESTMENTS_OPENAI_API_KEY }}"
            echo DAILY_CHANGE_TIME="${{ secrets.INVESTMENTS_DAILY_CHANGE_TIME }}"
            echo REGISTRATION_ENABLED="${{ secrets.INVESTMENTS_REGISTRATION_ENABLED }}"
            echo BASE_CURRENCY="${{ secrets.INVESTMENTS_BASE_CURRENCY }}"
            echo DB_CONNECTION="${{ secrets.INVESTMENTS_DB_CONNECTION }}"
            echo DB_HOST="${{ secrets.INVESTMENTS_DB_HOST }}"
            echo DB_PORT="${{ secrets.INVESTMENTS_DB_PORT }}"
            echo DB_DATABASE="${{ secrets.INVESTMENTS_DB_DATABASE }}"
            echo DB_USERNAME="${{ secrets.INVESTMENTS_DB_USERNAME }}"
            echo DB_PASSWORD="${{ secrets.INVESTMENTS_DB_PASSWORD }}"
            echo CACHE_STORE="${{ secrets.INVESTMENTS_CACHE_STORE }}"
            echo QUEUE_CONNECTION="${{ secrets.INVESTMENTS_QUEUE_CONNECTION }}"
            echo SESSION_DRIVER="${{ secrets.INVESTMENTS_SESSION_DRIVER }}"
          } > .env
          chmod 600 .env

      - name: Discover packages
        run: |
          set -euo pipefail
          mkdir -p \
            build/app/storage/framework/cache/data \
            build/app/storage/framework/sessions \
            build/app/storage/framework/views \
            build/app/storage/app/public \
            build/app/storage/logs \
            build/app/bootstrap/cache
          cd build/app
          php artisan package:discover --ansi
          php artisan filament:upgrade

      - name: Add root .htaccess and zip
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          cp .htaccess build/app/.htaccess
          cp deploy/mysql/*.php build/app/database/migrations/
          rm -rf release
          mkdir -p release
          (
            cd build/app
            zip -qr "../../release/${ARCHIVE:?}" .
          )

      - name: Upload via FTP
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.INVESTMENTS_FTP_SERVER }}
          user: ${{ secrets.INVESTMENTS_FTP_USERNAME }}
          password: ${{ secrets.INVESTMENTS_FTP_PASSWORD }}
          local_dir: "./release"
          ssl_check_hostname: "false"

      - name: Unzip, migrate, and cache
        uses: appleboy/ssh-action@master
        env:
          INVESTMENTS_SSH_REMOTE_PATH: ${{ secrets.INVESTMENTS_SSH_REMOTE_PATH }}
          INVESTMENTS_PHP_BIN: ${{ secrets.INVESTMENTS_PHP_BIN }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          command_timeout: 30m
          script_stop: true
          envs: INVESTMENTS_SSH_REMOTE_PATH,INVESTMENTS_PHP_BIN,ARCHIVE
          script: |
            set -eu
            cd "$INVESTMENTS_SSH_REMOTE_PATH"
            echo "Deploying archive ${ARCHIVE}"
            unzip -o "$ARCHIVE"
            rm -f "$ARCHIVE"
            chmod 600 .env
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/logs bootstrap/cache
            chmod -R u+rwX storage bootstrap/cache
            "$INVESTMENTS_PHP_BIN" artisan migrate --force
            "$INVESTMENTS_PHP_BIN" artisan storage:link --relative --force
            "$INVESTMENTS_PHP_BIN" artisan optimize:clear
            "$INVESTMENTS_PHP_BIN" artisan config:cache
            "$INVESTMENTS_PHP_BIN" artisan route:cache
            "$INVESTMENTS_PHP_BIN" artisan event:cache
            chmod 600 .env bootstrap/cache/config.php

      - name: Verify public site
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          base="https://investments.alebatistella.com"
          login_code=""
          dividend_code=""
          for attempt in 1 2 3 4 5 6; do
            login_code="$(curl -sS -o /tmp/login.html -w '%{http_code}' --max-time 30 "${base}/login" || true)"
            dividend_code="$(curl -sS -o /tmp/dividend.body -w '%{http_code}' --max-time 30 "${base}/api/dividend" || true)"
            echo "attempt=${attempt} source=${SOURCE_SHA} login_http=${login_code} dividend_http=${dividend_code}"
            if [[ "${login_code}" == "200" && "${dividend_code}" == "401" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "${login_code}" != "200" ]]; then
            echo "Login page returned HTTP ${login_code}, expected 200." >&2
            exit 1
          fi
          if ! grep -qiE 'type="password"|name="password"' /tmp/login.html; then
            echo "Login response was HTTP 200 but had no password field." >&2
            exit 1
          fi
          if [[ "${dividend_code}" != "401" ]]; then
            echo "GET /api/dividend returned HTTP ${dividend_code}, expected 401." >&2
            exit 1
          fi
          echo "Public checks passed for ${SOURCE_SHA}."
