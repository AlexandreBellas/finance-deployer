name: Deploy Firefly III

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/firefly-iii/firefly-iii/releases/latest \
            | jq -r .tag_name)
          mkdir build
          curl -fL -o "build/FireflyIII-${tag}.zip" \
            "https://github.com/firefly-iii/firefly-iii/releases/download/${tag}/FireflyIII-${tag}.zip"
          echo "archive=FireflyIII-${tag}.zip" >> "$GITHUB_OUTPUT"

      - name: Fill .env from secrets
        run: |
          echo APP_ENV=production > .env
          echo APP_DEBUG=false >> .env
          echo APP_KEY="${{ secrets.APP_KEY }}" >> .env
          echo APP_URL="${{ secrets.APP_URL }}" >> .env
          echo SITE_OWNER="${{ secrets.SITE_OWNER }}" >> .env
          echo DB_CONNECTION="${{ secrets.DB_CONNECTION }}" >> .env
          echo DB_HOST="${{ secrets.DB_HOST }}" >> .env
          echo DB_PORT="${{ secrets.DB_PORT }}" >> .env
          echo DB_DATABASE="${{ secrets.DB_DATABASE }}" >> .env
          echo DB_USERNAME="${{ secrets.DB_USERNAME }}" >> .env
          echo DB_PASSWORD="${{ secrets.DB_PASSWORD }}" >> .env
          zip -j "build/${{ steps.release.outputs.archive }}" .env
          rm .env

      - name: Replace root .htaccess
        run: |
          set -euo pipefail
          zip -j "build/${{ steps.release.outputs.archive }}" .htaccess

      - name: Upload via FTP
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: "./build"
          ssl_check_hostname: "false"

      - name: Unzip deploy files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          script: |
            cd ${{ secrets.SSH_REMOTE_PATH }}
            unzip -o ${{ steps.release.outputs.archive }}
            rm ${{ steps.release.outputs.archive }}
